<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#188443">
<title>Rajendra General Store</title>
<style>
:root{--g:#188443;--gd:#0f5f2f;--o:#FF9F32;--bg:#F1F8F2;--ink:#1d2b22;--mut:#6b7b70}
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
.hero{background:linear-gradient(160deg,var(--g),var(--gd));color:#fff;padding:20px 20px 64px;border-radius:0 0 32px 32px;position:relative;text-align:center}
.lang{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:600}
.logo{width:72px;height:72px;margin:18px auto 10px;background:#fff;border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.2)}
h1{margin:0;font-size:22px;letter-spacing:1.5px}
.tag{margin:6px 0 0;font-size:14px;opacity:.92}
.pill{display:inline-block;margin-top:16px;background:var(--o);color:#fff;font-weight:700;padding:10px 20px;border-radius:30px;font-size:16px;box-shadow:0 4px 12px rgba(255,159,50,.45)}
.card{background:#fff;margin:-36px 16px 0;padding:22px 18px;border-radius:20px;box-shadow:0 8px 24px rgba(24,132,67,.12);text-align:center;position:relative}
.card h2{margin:0 0 14px;font-size:19px}
.btn{display:block;background:var(--g);color:#fff;text-decoration:none;padding:15px;border-radius:14px;font-size:18px;font-weight:700}
.sec{margin:26px 16px 0}
.sec h3{margin:0 0 12px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:#fff;border-radius:16px;padding:14px 6px;text-align:center;font-size:13px;font-weight:600;opacity:.75}
.cat span{display:block;font-size:26px;margin-bottom:6px}
.soon{margin:14px 0 0;background:#FFF4E5;border:1px dashed var(--o);color:#8a5200;border-radius:14px;padding:12px;text-align:center;font-size:14px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:26px 16px 30px}
</style>
</head>
<body>
<div class="hero">
  <button class="lang" id="lang" type="button">हिं</button>
  <div class="logo">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#188443" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="Store"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9a3 3 0 006 0 3 3 0 006 0 3 3 0 006 0"/><path d="M5 12v8h14v-8"/><path d="M10 20v-5h4v5"/></svg>
  </div>
  <h1>RAJENDRA GENERAL STORE</h1>
  <p class="tag" data-hl="Har Ghar Ki Zaroorat, Ab Aur Bhi Aasaan!" data-hi="हर घर की ज़रूरत, अब और भी आसान!" data-en="Every home’s need, now even easier!">Har Ghar Ki Zaroorat, Ab Aur Bhi Aasaan!</p>
  <div class="pill" data-hl="Ghar ka Saman Ghar Baithe!" data-hi="घर का सामान घर बैठे!" data-en="Home essentials, right at your door!">Ghar ka Saman Ghar Baithe!</div>
</div>
